name: release

# Pushing a tag v<version> releases that version:  git tag v4.0.0-RC1 && git push origin v4.0.0-RC1
# The workflow builds and tests the tagged commit with the version taken from the tag and pushes the image to this
# repository's GitHub Container Registry (ghcr.io/mdoering/ipt4). A final version (no suffix, e.g. v4.0.0) is also
# tagged latest. IPT4 is experimental and not approved by GBIF yet, so nothing goes to Docker Hub (gbif/ipt).
# Started by hand (Actions tab or `gh workflow run release.yml`) it is a dry run: build, tests and image smoke test,
# nothing pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            tools/set-version.sh "$version"
          else
            version=dry-run
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: mvn -B verify
      - name: JavaScript tests
        run: node --test 'ipt-app/src/test/js/*.test.js'
      - name: Image smoke test
        run: tools/docker-smoke.sh "gbif/ipt:$VERSION"
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: github.ref_type == 'tag'
        run: tools/push-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "$VERSION"
