name: release

# Started by hand only. Builds and tests the given version and pushes the image to docker.gbif.org and Docker Hub.
# Needs the repository secrets GBIF_DOCKER_USER/GBIF_DOCKER_PASSWORD and DOCKERHUB_USER/DOCKERHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 4.0.0-RC1
        required: true
      latest:
        description: Also tag the image as latest (final releases only)
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set the version
        run: mvn -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false
      - name: Build and test
        run: mvn -B verify
      - name: JavaScript tests
        run: node --test 'ipt-app/src/test/js/*.test.js'
      - name: Image smoke test
        run: tools/docker-smoke.sh gbif/ipt:${{ inputs.version }}
      - uses: docker/login-action@v3
        with:
          registry: docker.gbif.org
          username: ${{ secrets.GBIF_DOCKER_USER }}
          password: ${{ secrets.GBIF_DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the image
        run: |
          for repo in docker.gbif.org/ipt gbif/ipt; do
            docker tag gbif/ipt:${{ inputs.version }} $repo:${{ inputs.version }}
            docker push $repo:${{ inputs.version }}
            if [ "${{ inputs.latest }}" = "true" ]; then
              docker tag gbif/ipt:${{ inputs.version }} $repo:latest
              docker push $repo:latest
            fi
          done
