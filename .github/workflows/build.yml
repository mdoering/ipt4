name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: JavaScript tests
        run: node --test 'ipt-app/src/test/js/*.test.js'
      - name: Template migration tool
        run: tools/ftl-migrate/test.sh
      - name: Docker image
        run: tools/docker-smoke.sh gbif/ipt:ci
      # every green build of main is published to the GitHub Container Registry as :main and :sha-<commit>
      - name: Publish image to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in main "sha-${GITHUB_SHA::7}"; do
            docker tag gbif/ipt:ci "$image:$tag"
            docker push "$image:$tag"
          done
