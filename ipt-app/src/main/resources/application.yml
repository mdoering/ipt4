spring:
  application:
    name: ipt
  servlet:
    multipart:
      # IPT 3: struts.multipart.maxSize; the upload directory is the data dir's tmp/uploads (WebConfig)
      max-file-size: ${ipt.upload.max-size:10GB}
      max-request-size: ${ipt.upload.max-size:10GB}
      file-size-threshold: 1MB
  main:
    banner-mode: off
  web:
    resources:
      cache:
        # Asset file names are not versioned, so keep this short; browsers revalidate with Last-Modified after it
        cachecontrol:
          max-age: 1h

server:
  port: 8080
  shutdown: graceful
  # X-Forwarded-* headers are applied by TrustedProxyForwardedHeaderFilter, only for ipt.trusted-proxies
  forward-headers-strategy: none
  tomcat:
    # metadata and mapping forms post thousands of fields (Tomcat's defaults: 1000 parameters, 50 parts, 2 MB)
    max-parameter-count: 100000
    max-part-count: 100000
    max-http-form-post-size: 50MB
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health

ipt:
  data-dir: ${IPT_DATA_DIR:}
  # Read by logback-spring.xml before the application context exists
  log-dir: ${IPT_LOG_DIR:${IPT_DATA_DIR:${java.io.tmpdir}/ipt4}/logs}
  default-locale: en
  dev-mode: false
  # Overrides of the built-in settings in ipt-defaults.properties, e.g. a local registry for development:
  # defaults:
  #   "[dev.registrydev.url]": http://localhost:8080
  # Regex of reverse-proxy addresses whose X-Forwarded-* headers are trusted; default: loopback and private networks
  # trusted-proxies: 10\.0\.0\.5
